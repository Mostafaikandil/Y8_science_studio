<head>

<title>Y8 Science Studio</title>
<style>
:root{--g1:rgba(15,118,110,.2);--g2:rgba(124,58,237,.15);--grid:rgba(15,118,110,.07);--bg:#f0faf8;--card:#fff;--ink:#10252b;--ac:#0f766e;--ac2:#7c3aed;--good:#16a34a;--bad:#dc2626;--key:#dcefec;--mute:#5d7b80;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:rgba(45,212,191,.22);--g2:rgba(167,139,250,.18);--grid:rgba(120,220,200,.06);--bg:#0e1b22;--card:#16262f;--ink:#e8f6f4;--ac:#2dd4bf;--ac2:#a78bfa;--good:#4ade80;--bad:#f87171;--key:#223743;--mute:#9ec0c0}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html,body{margin:0;min-height:100%}
body{background-color:var(--bg);background-image:radial-gradient(60rem 40rem at 8% -8%,var(--g1),transparent 62%),radial-gradient(50rem 40rem at 100% 108%,var(--g2),transparent 58%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,auto,34px 34px,34px 34px;background-attachment:fixed;color:var(--ink);font-family:"Avenir Next","Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:560px;padding:14px;display:flex;flex-direction:column;align-items:center}
h1{font-size:28px;margin:10px 0 2px;text-align:center}h2{margin:6px 0 8px;font-size:19px}
.sub{color:var(--mute);text-align:center;margin:0 0 14px}
.card{background:var(--card);border-radius:18px;padding:18px;width:100%;border:1px solid var(--key);box-shadow:0 6px 22px rgba(20,20,60,.16);margin-bottom:12px}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:14px;font-size:18px;font-weight:700;padding:12px 22px;margin-top:10px;cursor:pointer}
.btn.alt{background:var(--key);color:var(--ink)}.btn.sm{font-size:14px;padding:8px 12px;margin:0}
.row2{display:flex;gap:10px;width:100%}.row2 .btn{flex:1;margin:0 0 12px}
.mod,.lvl{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:6px 0;padding:13px 16px;border-radius:16px;border:2px solid var(--key);background:var(--card);color:var(--ink);font-size:15px;cursor:pointer}
.mod .ic{font-size:30px;width:38px;text-align:center}.mod b,.lvl b{display:block;font-size:17px}.mod small,.mod em{display:block;color:var(--mute);font-style:normal;font-size:13px}
.lvl{display:block}.lvl[disabled]{opacity:.4}.lvl small{float:right;color:var(--mute)}
.top{display:flex;gap:6px;justify-content:space-between;align-items:center;width:100%;font-weight:700;margin-bottom:8px;font-size:15px}
.bar{height:8px;width:100%;background:var(--key);border-radius:8px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--ac2)}
.tag{color:var(--mute);font-size:13px;margin-bottom:8px}
.qt{font-size:26px;font-weight:700;line-height:1.35;margin:6px 0 14px;text-align:center}
#ans{min-height:58px;border:3px solid var(--ac);border-radius:12px;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:2px}
#ans.good{border-color:var(--good);color:var(--good)}#ans.bad{border-color:var(--bad);color:var(--bad)}
.opt{display:block;width:100%;margin:8px 0;padding:14px;border-radius:12px;border:2px solid var(--key);background:var(--card);color:var(--ink);font-size:22px;font-weight:700;cursor:pointer}
.opt.good{border-color:var(--good)}.opt.bad{border-color:var(--bad)}
#fb{min-height:24px;margin-top:10px;text-align:center}.sol{color:var(--mute);margin:6px 0;font-size:15px;text-align:left}
#kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
#kp button{font-size:26px;font-weight:700;padding:14px 0;border:0;border-radius:12px;background:var(--key);color:var(--ink);cursor:pointer}
#kp .en{background:var(--good);color:#fff}#kp .bk{background:var(--bad);color:#fff}
#pad{display:none;width:100%;height:190px;border:2px dashed var(--mute);border-radius:12px;background:var(--card);touch-action:none;margin-bottom:6px}
input,textarea{font:inherit;font-size:18px;padding:10px;border-radius:12px;border:2px solid var(--key);width:100%;background:var(--card);color:var(--ink);user-select:text;-webkit-user-select:text;text-align:center}
textarea{height:70px;font-size:12px;text-align:left}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--key);text-align:center}.tbl td:first-child{text-align:left}
.wr{text-align:left;font-size:14px;padding:6px 0;border-bottom:1px solid var(--key)}.wr em{color:var(--mute);font-style:normal;font-size:12px}
.foot{padding:10px 0}
.tb{padding:6px 10px;font-size:16px}
.fg{width:100%;max-height:320px;display:block;margin:4px auto 8px}.ln{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.sl{stroke:var(--mute);stroke-width:1.5}
.pc{fill:var(--card);stroke:var(--ac);stroke-width:2}.pc.h{fill:var(--ac)}.pn{font:700 13px Arial,sans-serif;fill:var(--ink);text-anchor:middle}.pn.h{fill:var(--bg)}.dot{fill:var(--bad)}
.tx{font:600 10.5px Arial,sans-serif;fill:#1f2433;text-anchor:middle}.t2{font:700 22px Arial,sans-serif;fill:var(--ink);text-anchor:middle}.t3{font:600 13px Arial,sans-serif;fill:var(--ink);text-anchor:middle}
.mask{text-align:center;font:700 22px "Courier New",monospace;letter-spacing:2px;margin:4px 0 10px;color:var(--mute)}
input.good{border-color:var(--good)}input.bad{border-color:var(--bad)}#ti{margin-bottom:4px}
.medal{position:relative;width:132px;height:132px;border-radius:50%;margin:10px auto 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;animation:mpop .9s cubic-bezier(.2,1.5,.4,1) both;box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 0 0 5px rgba(255,255,255,.4),inset 0 0 0 9px rgba(0,0,0,.12)}
.medal.t1{background:conic-gradient(from 210deg,#c47a3a,#f0b27a,#a85c1e,#e5a064,#c47a3a)}
.medal.t2{background:conic-gradient(from 210deg,#9aa5b1,#f4f6f7,#7b8794,#e3e8ec,#9aa5b1)}
.medal.t3{background:conic-gradient(from 210deg,#d9a000,#fff1a0,#c88f00,#ffe27a,#d9a000);box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 0 0 5px rgba(255,255,255,.45),inset 0 0 0 9px rgba(0,0,0,.12),0 0 36px rgba(255,200,40,.55)}
.medal.t0{background:var(--key);opacity:.55;animation:none;box-shadow:inset 0 0 0 4px rgba(0,0,0,.08)}
.medal .mi{font-size:46px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.medal .mt{font:700 13px Arial,sans-serif;color:#2b2110;margin-top:4px;letter-spacing:.5px;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.medal.sm{width:78px;height:78px;margin:4px}.medal.sm .mi{font-size:30px}
.mshine{position:absolute;top:-20%;left:-60%;width:36%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-20deg);animation:msweep 2.4s ease-in-out .6s infinite}
.medal.t0 .mshine{display:none}
@keyframes msweep{0%{left:-60%}60%,100%{left:130%}}@keyframes mpop{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
.bn{font-weight:700;font-size:19px;margin-bottom:6px}
.trow{display:flex;justify-content:center;gap:10px;margin-bottom:12px}.trow>div{text-align:center;font-size:12px;color:var(--mute)}
.conf{position:fixed;left:0;right:0;top:0;bottom:0;pointer-events:none;overflow:hidden;z-index:50}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>

var CH=[[131,165,196,247],[110,131,165,196],[87,110,131,165],[98,123,147,165]],ML=[0,0,659,0,0,784,0,0,0,659,0,587,0,523,0,0,0,0,523,0,0,659,0,440,0,0,784,0,659,0,587,0];
function mt2(fq,at,d,type,v,att){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=fq;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(v,at+att);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g);g.connect(MG);o.start(at);o.stop(at+d+.05);}
function msched(){if(!AC)return;while(mNext<AC.currentTime+1.5){var st=mStep,c=CH[(st/8)|0];if(st%8===0)c.forEach(function(fq){mt2(fq,mNext,3.6,"sine",.018,.9);});if(st%4===0)mt2(c[0],mNext,1.2,"triangle",.035,.05);if(ML[st])mt2(ML[st],mNext,1,"sine",.03,.03);mNext+=.4167;mStep=(mStep+1)%32;}}
function msync(){if(!AC)return;if(S.nomusic){if(MT){clearInterval(MT);MT=null;}return;}if(!MT){mNext=AC.currentTime+.2;MT=setInterval(msched,300);}}
document.addEventListener("pointerdown",function(){if(ac())msync();});
document.addEventListener("visibilitychange",function(){if(!AC)return;if(document.hidden)AC.suspend();else AC.resume();});
var streak=0,TN2=["","Bronze","Silver","Gold"];
function confetti(){var w=document.createElement("div");w.className="conf";var cs=["#ffd23f","#2dd4bf","#818cf8","#f472b6","#4ade80","#fb923c"],i,p;
 for(i=0;i<45;i++){p=document.createElement("i");p.style.left=R(0,100)+"%";p.style.background=cs[R(0,5)];p.style.animationDuration=(2.2+Math.random()*2)+"s";p.style.animationDelay=(Math.random()*.6)+"s";p.style.transform="rotate("+R(0,360)+"deg)";w.appendChild(p);}
 document.body.appendChild(w);setTimeout(function(){w.remove();},5000);}
function medalHTML(t,m,l,sm){return '<div class="medal t'+t+(sm?' sm':'')+'"><i class="mshine"></i><span class="mi">'+(t?MODS[m][2]:"?")+'</span><span class="mt">'+(sm?"":TN[l])+'</span></div>';}
function trophies(){var h,m,l,t,n=0,k;for(k in S.badges)if(S.badges[k]>0)n++;
 h='<h1>My trophies 🏆</h1><p class="sub">'+n+' of '+MODS.length*3+' medals earned · Bronze 80% · Silver 90% · Gold 100%</p><div class="card">';
 for(m=0;m<MODS.length;m++){h+='<h2>'+(m+1)+'. '+MODS[m][0]+'</h2><div class="trow">';for(l=0;l<3;l++){t=S.badges[m+"_"+l]||0;h+='<div>'+medalHTML(t,m,l,true)+(t?TN2[t]:TN[l])+'</div>';}h+='</div>';}
 app.innerHTML=h+'</div><button class="btn alt" id="bk">◀ Back</button>';$("bk").onclick=home;}
/* ---------- screens ---------- */
function welcome(){
 app.innerHTML='<h1>Science Studio</h1><p class="sub">Welcome! What is your name?</p><div class="card"><input id="nmi" maxlength="20" placeholder="Your name" autocomplete="off"><button class="btn" id="go">Start</button></div>';
 $("go").onclick=function(){var v=$("nmi").value.trim();if(!v){$("nmi").focus();return;}S.name=v;save();home();};
}
function home(){
 if(!S.name)return welcome();
 var h='<h1>Hi '+esc(S.name)+'</h1><p class="sub">Choose a topic, or test yourself across everything.</p><div class="row2"><button class="btn" id="mx">'+(S.sess.x?"▶ Resume mixed":"🔀 Mixed review")+'</button><button class="btn alt" id="qc">'+(S.sess.q?"▶ Resume check":"🎯 Quick check")+'</button></div>';
 MODS.forEach(function(m,i){var st=S.stat[i],acc=st&&st.n?Math.round(100*st.c/st.n)+"% correct so far":"not started";h+='<button class="mod" data-m="'+i+'"><span class="ic">'+m[2]+'</span><span><b>'+(i+1)+'. '+m[0]+'</b><small>'+m[1]+'</small><em>'+Math.min(S.prog[i],3)+' of 3 tiers unlocked · '+acc+'</em></span></button>';});
 h+='<div class="foot"><button class="btn alt sm" id="tr">🏆 Trophies</button> <button class="btn alt sm" id="par">Parent area</button> <button class="btn alt sm" id="mu">'+(S.mute?"🔇":"🔊")+'</button> <button class="btn alt sm" id="mm">'+(S.nomusic?"🔕":"🎵")+'</button></div>';
 app.innerHTML=h;
 app.querySelectorAll(".mod").forEach(function(b){b.onclick=function(){tiers(+b.dataset.m);};});
 $("mx").onclick=startMix;$("qc").onclick=startQuick;$("par").onclick=gate;$("tr").onclick=trophies;
 $("mu").onclick=function(){S.mute=!S.mute;save();home();if(!S.mute)sfx("ok");};
 $("mm").onclick=function(){S.nomusic=!S.nomusic;save();msync();home();};
}
function tiers(m){
 var h='<h1>'+MODS[m][0]+'</h1><p class="sub">Score 80% or more to unlock the next tier.</p><div class="card" style="padding:8px 14px">';
 for(var t=0;t<3;t++){var ok=t<S.prog[m],b=S.best[m+"_"+t],ss=S.sess["t"+m+"_"+t];h+='<button class="lvl" data-t="'+t+'"'+(ok?"":" disabled")+'><b>'+(ok?"":"🔒 ")+TN[t]+(ss&&ss.qi<ss.qs.length?'<small>▶ In progress ('+ss.qi+'/'+ss.qs.length+')</small>':b!=null?'<small>Best '+b+'%</small>':"")+'</b>'+TD[t]+'</button>';}
 app.innerHTML=h+'</div><button class="btn alt" id="bk">◀ Back</button>';
 app.querySelectorAll(".lvl").forEach(function(b){b.onclick=function(){startTier(m,+b.dataset.t);};});
 $("bk").onclick=home;
}
function mk(){}
function begin(k,m,t,list){streak=0;ses={k:k,m:m,t:t,per:{}};qs=list;qi=0;sc=0;draw();}
function skeyOf(k,m,t){return k==="t"?"t"+m+"_"+t:k;}
function resume(k,m,t){var x=S.sess[skeyOf(k,m,t)];if(!x||!x.qs||!x.qs.length)return false;
 streak=0;ses={k:k,m:m,t:t,per:x.per||{}};qs=x.qs;sc=x.sc;qi=x.qi;
 if(qi>=qs.length){finish();return true;}
 if(!confirm("Continue where you stopped (question "+(qi+1)+" of "+qs.length+")?\n\nOK = continue, Cancel = start a new round.")){delete S.sess[skeyOf(k,m,t)];save();return false;}
 draw();return true;}
function startTier(m,t){if(resume("t",m,t))return;begin("t",m,t,build(m,t));}
function startMix(){if(resume("x",0,0))return;var l=[],seen={},i,m,t,q,n=0;while(l.length<NQ&&n++<100){m=R(0,BANK.length-1);t=R(0,Math.min(S.prog[m],3)-1);q=one(m,t);if(!seen[q.q]){seen[q.q]=1;l.push(q);}}begin("x",0,0,l);}
function startQuick(){if(resume("q",0,0))return;var l=[],m;for(m=0;m<BANK.length;m++){l.push(one(m,0));l.push(one(m,1));}begin("q",0,0,shuf(l));}
function draw(){
 var q=qs[qi],h,i;ent="";done=false;wait=false;clearTimeout(tmr);
 h='<div class="top"><button class="btn alt sm" id="hm">🏠 Home</button><span><button class="btn alt sm tb" id="sp">✏️</button> <button class="btn alt sm tb" id="pc" style="display:none">Clear</button> <button class="btn alt sm tb" id="mm2">'+(S.nomusic?"🔕":"🎵")+'</button> <button class="btn alt sm tb" id="mt">'+(S.mute?"🔇":"🔊")+'</button></span></div>'+
 '<div class="bar"><i style="width:'+(qi/qs.length*100)+'%"></i></div><div class="card"><div class="tag">'+(ses.k==="t"?TN[ses.t]:ses.k==="x"?"Mixed review":"Quick check")+' · Question '+(qi+1)+' of '+qs.length+' · '+MODS[q.m][0]+'</div>'+(q.fig||"")+'<div class="qt">'+q.q+'</div>';
 if(q.o){for(i=0;i<q.o.length;i++)h+='<button class="opt" data-i="'+i+'">'+q.o[i]+'</button>';}
 else if(q.k==="t"){h+=(q.mask?'<div class="mask">'+mask(q.a[0])+'</div>':"")+'<input id="ti" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Type your answer"><button class="btn" id="ok">Check</button>';}
 else h+='<div id="ans"></div>';
 h+='<div id="fb"></div></div><canvas id="pad"></canvas>';
 if(!q.o&&q.k!=="t"){h+='<div id="kp">';["7","8","9","⌫","4","5","6","−","1","2","3","/",".","0",":","↵"].forEach(function(k){h+='<button data-k="'+k+'"'+(k==="↵"?' class="en"':k==="⌫"?' class="bk"':"")+'>'+k+'</button>';});h+='</div>';}
 app.innerHTML=h;show();
 app.querySelectorAll("#kp button").forEach(function(b){b.onclick=function(){key(b.dataset.k);};});
 app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(!done)grade(+b.dataset.i===q.a,+b.dataset.i);};});
 var ti=$("ti");if(ti){ti.onkeydown=function(e){if(e.key==="Enter")subT();};$("ok").onclick=subT;ti.focus();}
 $("sp").onclick=function(){padOn=!padOn;pad();};pad();
 $("hm").onclick=function(){clearTimeout(tmr);home();};
 $("mm2").onclick=function(){S.nomusic=!S.nomusic;save();this.textContent=S.nomusic?"🔕":"🎵";msync();};
 $("mt").onclick=function(){S.mute=!S.mute;save();this.textContent=S.mute?"🔇":"🔊";if(!S.mute)sfx("ok");};
 S.sess[skeyOf(ses.k,ses.m,ses.t)]={qs:qs,qi:qi,sc:sc,per:ses.per};save();
}
function subT(){if(done)return;var q=qs[qi],v=$("ti").value,r;if(!v.trim())return;r=chkT(v,q);grade(r>0,v,r===1?"Check the spelling: "+q.a[0]:"");}
function pad(){
 var c=$("pad");if(!c)return;$("pc").style.display=padOn?"inline-block":"none";c.style.display=padOn?"block":"none";if(!padOn)return;
 c.width=c.clientWidth;c.height=c.clientHeight;var x=c.getContext("2d"),dn=false;x.lineWidth=3;x.lineCap="round";x.strokeStyle=getComputedStyle(document.body).color;
 function pt(e){var b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];}
 c.onpointerdown=function(e){dn=true;var p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);try{c.setPointerCapture(e.pointerId);}catch(z){}};
 c.onpointermove=function(e){if(!dn)return;var p=pt(e);x.lineTo(p[0],p[1]);x.stroke();};
 c.onpointerup=function(){dn=false;};
 $("pc").onclick=function(){x.clearRect(0,0,c.width,c.height);};
}
function show(){var a=$("ans");if(a)a.innerHTML=ent?esc(ent.replace(/-/g,"−")):'<span style="color:var(--mute);font-size:18px;font-weight:400">type your answer</span>';}
function key(k){
 if(wait){if(k==="↵")next();return;}if(done)return;
 if(k==="⌫")ent=ent.slice(0,-1);else if(k==="↵"){if(ent!=="")grade(eq(ent,qs[qi]),ent);return;}else if(ent.length<12)ent+=(k==="−"?"-":k);
 show();
}
function grade(ok,given,note){
 var q=qs[qi],a=$("ans"),fb=$("fb"),ti=$("ti"),shown=q.o?q.o[q.a]:q.k==="t"?q.a[0]:String(q.a).replace(/-/g,"−"),st,pp;done=true;wait=true;
 st=S.stat[q.m]=S.stat[q.m]||{n:0,c:0};st.n++;pp=ses.per[q.m]=ses.per[q.m]||{n:0,c:0};pp.n++;
 if(q.o){app.querySelectorAll(".opt").forEach(function(b){if(+b.dataset.i===q.a)b.classList.add("good");else if(+b.dataset.i===given)b.classList.add("bad");});}
 else if(ti){ti.disabled=true;ti.classList.add(ok?"good":"bad");$("ok").style.display="none";}
 else a.classList.add(ok?"good":"bad");
 if(ok){sc++;streak++;st.c++;pp.c++;sfx("ok");fb.innerHTML='<b style="color:var(--good)">Correct, '+esc(S.name)+'!'+(streak>=3?' 🔥 '+streak+' in a row':'')+'</b>'+(note?'<div class="sol">'+esc(note)+'</div>':"")+(q.sol?'<div class="sol">'+q.sol+'</div>':"")+'<button class="btn alt sm" id="nx" style="margin-top:8px">Next ▶</button>';tmr=setTimeout(next,note?4200:3200);}
 else{streak=0;sfx("no");S.wrong.push({m:q.m,t:q.t,q:q.q,u:q.o?q.o[given]:String(given),c:shown,d:Date.now()});S.wrong=S.wrong.slice(-80);
  fb.innerHTML='<div style="color:var(--bad)"><b>Not quite.</b> The answer is <b>'+shown+'</b></div><div class="sol">'+q.sol+'</div><button class="btn" id="nx">Next ▶</button>';}
 $("nx").onclick=next;
 S.sess[skeyOf(ses.k,ses.m,ses.t)]={qs:qs,qi:qi+1,sc:sc,per:ses.per};save();
}
function next(){clearTimeout(tmr);qi++;qi<qs.length?draw():finish();}
function fmt(t){var d=new Date(t);return d.getDate()+"/"+(d.getMonth()+1)+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
function finish(){
 var n=qs.length,need=Math.ceil(.8*n),pc=Math.round(100*sc/n),h='<div class="card" style="margin-top:20px;text-align:center"><h1>'+sc+' out of '+n+'</h1>',pass=false,m;
 if(ses.k==="t"){pass=sc>=need;m=ses.m;var bk=m+"_"+ses.t;if(S.best[bk]==null||pc>S.best[bk])S.best[bk]=pc;if(pass&&ses.t<2&&S.prog[m]<ses.t+2)S.prog[m]=ses.t+2;
  var tier=pass?(sc>=n?3:(100*sc/n>=90?2:1)):0,old=S.badges[bk]||0;if(tier>old)S.badges[bk]=tier;if(pass)h+=medalHTML(tier,m,ses.t)+'<div class="bn">'+TN2[tier]+' medal'+(tier>old?' · NEW!':'')+'</div>';
  h+=pass?'<p>Well done, '+esc(S.name)+'! '+(ses.t<2?TN[ses.t+1]+' is now open.':'You have completed every tier of this topic.')+'</p>':'<p>You need '+need+' out of '+n+' (80%) to move on. Read the explanations for the ones you missed and try again.</p>';
  h+=(pass&&ses.t<2?'<button class="btn" id="nt">Next tier ▶</button><br>':'')+'<button class="btn alt" id="rt">Play again</button><br><button class="btn alt" id="mn">Menu</button></div>';}
 else{h+='<p>Results by topic:</p>';for(m in ses.per){var p=ses.per[m];h+='<div class="wr">'+MODS[m][0]+': <b>'+p.c+'/'+p.n+'</b>'+(p.c/p.n<.7?' · needs more practice':'')+'</div>';}h+='<button class="btn alt" id="rt">Go again</button><br><button class="btn alt" id="mn">Menu</button></div>';}
 delete S.sess[skeyOf(ses.k,ses.m,ses.t)];S.plays.push({k:ses.k,m:ses.m,t:ses.t,s:sc,n:n,d:Date.now()});S.plays=S.plays.slice(-60);save();
 app.innerHTML=h;sfx(ses.k==="t"&&!pass?"no":"win");if(ses.k==="t"&&pass)setTimeout(confetti,250);
 if($("nt"))$("nt").onclick=function(){startTier(ses.m,ses.t+1);};
 $("rt").onclick=function(){ses.k==="t"?startTier(ses.m,ses.t):ses.k==="x"?startMix():startQuick();};$("mn").onclick=home;
}
/* ---------- parent area ---------- */
function gate(){
 app.innerHTML='<h1>Parent area</h1><div class="card"><p>'+(S.pin?"Enter your 4-digit PIN":"Set a 4-digit PIN to protect this area")+'</p><input id="pn" type="password" inputmode="numeric" maxlength="4" placeholder="PIN"><button class="btn" id="gg">OK</button><div id="ge" style="color:var(--bad);min-height:22px;margin-top:8px"></div></div><button class="btn alt" id="bk">◀ Back</button>';
 $("bk").onclick=home;
 $("gg").onclick=function(){var v=$("pn").value;if(!/^\d{4}$/.test(v)){$("ge").textContent="Use exactly 4 digits";return;}if(!S.pin){S.pin=v;save();parent();}else if(v===S.pin)parent();else $("ge").textContent="Wrong PIN";};
}
function parent(){
 var h='<h1>Progress: '+esc(S.name)+'</h1><div class="card"><h2>Accuracy and best scores</h2><table class="tbl"><tr><th></th><th>Acc.</th><th>Warm</th><th>Prac.</th><th>Chal.</th></tr>',i,t,s,b;
 for(i=0;i<MODS.length;i++){s=S.stat[i];h+='<tr><td>'+(i+1)+'. '+MODS[i][0]+'</td><td>'+(s&&s.n?Math.round(100*s.c/s.n)+"%":"–")+'</td>';for(t=0;t<3;t++){b=S.best[i+"_"+t];h+='<td>'+(b!=null?b+"%":(t<S.prog[i]?"–":"🔒"))+'</td>';}h+='</tr>';}
 h+='</table></div><div class="card"><h2>Recent mistakes</h2>';
 var w=S.wrong.slice().reverse().slice(0,30);if(!w.length)h+='<p>None recorded yet.</p>';
 w.forEach(function(x){h+='<div class="wr"><b>'+x.q+'</b> → correct '+x.c+', she wrote '+esc(x.u)+' <em>· '+MODS[x.m][0]+' · '+fmt(x.d)+'</em></div>';});
 h+='</div><div class="card"><h2>Backup</h2><p style="font-size:13px;color:var(--mute)">Copy this code somewhere safe. Paste it on a new device to restore progress.</p><textarea id="bc" readonly></textarea><button class="btn alt sm" id="ex" style="margin-top:8px">Show backup code</button><textarea id="im" placeholder="Paste a backup code here" style="margin-top:10px"></textarea><button class="btn alt sm" id="rs" style="margin-top:8px">Restore from code</button><div id="bm" style="min-height:22px;margin-top:6px"></div></div>'+
 '<div class="card"><button class="btn alt sm" id="cn">Change name</button> <button class="btn alt sm" id="rr">Reset all progress</button></div><button class="btn alt" id="bk">◀ Back</button>';
 app.innerHTML=h;var arm=false;$("bk").onclick=home;
 $("ex").onclick=function(){$("bc").value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$("bc").select();};
 $("rs").onclick=function(){try{var d=JSON.parse(decodeURIComponent(escape(atob($("im").value.trim()))));if(!d.prog||d.prog.length!==8)throw 0;d.sess=d.sess||{};d.badges=d.badges||{};S=d;save();$("bm").textContent="Restored.";setTimeout(home,700);}catch(e){$("bm").textContent="That code did not work.";}};
 $("cn").onclick=function(){S.name="";save();welcome();};
 $("rr").onclick=function(){if(!arm){arm=true;this.textContent="Tap again to confirm";}else{S=blank();save();welcome();}};
}
document.addEventListener("keydown",function(e){if(wait&&e.key==="Enter"){next();return;}if(!qs.length||!$("kp"))return;var k=e.key;if(/^[0-9./:]$/.test(k))key(k);else if(k==="-")key("−");else if(k==="Backspace")key("⌫");else if(k==="Enter")key("↵");});
home();
</script>
